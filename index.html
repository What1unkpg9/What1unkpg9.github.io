<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What1unkpg9 | Live Time</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #161b22;
            padding: 2rem 3rem;
            border-radius: 16px;
            border: 1px solid #30363d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { margin-top: 0; color: #58a6ff; font-size: 1.8rem; }
        .time-box {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin: 2rem 0;
        }
        .time-item {
            background: #21262d;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            border: 1px solid #30363d;
            min-width: 140px;
        }
        .city { font-size: 0.9rem; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
        .clock { font-size: 2.2rem; font-weight: bold; color: #f0f6fc; margin-top: 0.3rem; }
        .footer { font-size: 0.75rem; color: #484f58; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>What1unkpg9!</h1>
        <div class="time-box">
            <div class="time-item">
                <div class="city">Москва 🇷🇺</div>
                <div class="clock" id="moscow-clock">--:--:--</div>
            </div>
            <div class="time-item">
                <div class="city">Нью-Йорк 🇺🇸</div>
                <div class="clock" id="ny-clock">--:--:--</div>
            </div>
        </div>
        <div class="footer">
            Шаблон сгенерирован Python & GitHub Actions<br>
            Сборка: 2026-07-29 15:04:49 UTC
        </div>
    </div>

    <script>
        function updateClocks() {
            const now = new Date();
            
            // Время в Москве
            const moscow = now.toLocaleTimeString("ru-RU", {
                timeZone: "Europe/Moscow",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            });
            
            // Время в Нью-Йорке
            const ny = now.toLocaleTimeString("ru-RU", {
                timeZone: "America/New_York",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            });

            document.getElementById("moscow-clock").innerText = moscow;
            document.getElementById("ny-clock").innerText = ny;
        }

        // Обновляем каждую секунду (1000 мс)
        setInterval(updateClocks, 1000);
        updateClocks();
    </script>
</body>
</html>
