<!DOCTYPE html>
<html lang="ru">
<head>

        body {
            background-color: #0d1117;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #161b22;
            padding: 2rem 3rem;

            border: 1px solid #30363d;

        .time-box {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin: 2rem 0;
        }
        .time-item {
            background: #21262d;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            border: 1px solid #30363d;
        }
        .city { font-size: 0.9rem; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
        .clock { font-size: 2.2rem; font-weight: bold; color: #f0f6fc; margin-top: 0.3rem; }
        .footer { font-size: 0.75rem; color: #484f58; margin-top: 1.5rem; }
    </style>
</head>
